<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verschiedene Techniken zur Berechnung der Nullstellen von ganzrationalen Funktionen</title>

  <style>
    :root {
      --bg: #f2f2f2;
      --fg: #222;
      --card-bg: #ffffff;
      --card-fg: #222;
      --border: #dddddd;
      --accent: #0068ff;
      --shadow: 0 8px 20px rgba(0,0,0,0.08);
      --btn-bg: #e0e0e0;
      --btn-fg: #222;
    }

    body.dark {
      --bg: #111;
      --fg: #f5f5f5;
      --card-bg: #1d1d1d;
      --card-fg: #ffffff;
      --border: #333;
      --accent: #66aaff;
      --shadow: 0 8px 20px rgba(0,0,0,0.5);
      --btn-bg: #2a2a2a;
      --btn-fg: #f5f5f5;
    }

    body {
      font-family: system-ui, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--fg);
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 650px;
    }

    h1 {
      text-align: center;
      font-size: 1.4rem;
      margin-bottom: 12px;
    }

    .subtitle {
      text-align: center;
      opacity: 0.8;
      font-size: 0.9rem;
      margin-bottom: 20px;
    }

    .top-bar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 12px;
    }

    button {
      border: none;
      padding: 8px 14px;
      border-radius: 999px;
      background: var(--btn-bg);
      color: var(--btn-fg);
      cursor: pointer;
      transition: 0.2s;
      font-size: 0.9rem;
    }

    button.primary {
      background: var(--accent);
      color: #ffffff;
    }

    button:active {
      transform: scale(0.96);
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 16px;
    }

   .card-wrapper {
  display: flex;
  justify-content: center;
  margin-bottom: 60px;   /* NEU: Buttons werden nicht mehr verdeckt, weiter nach unten geschoben */
}


    .card {
      width: 100%;
      max-width: 420px;
      height: 300px;
      perspective: 1000px;
    }

    .card-inner {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.5s;
      cursor: pointer;
    }

    .card-inner.flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      padding: 20px;
      border-radius: 20px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      background: var(--card-bg);
      color: var(--card-fg);
      backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      white-space: pre-line;
    }

    .card-back {
      transform: rotateY(180deg);
    }

    .function {
      font-size: 1.2rem;
      font-weight: 600;
    }

    .method-pill {
      padding: 6px 10px;
      background: rgba(0,0,0,0.05);
      border-radius: 8px;
      display: inline-block;
      margin: 6px 0;
      font-size: 0.85rem;
    }

    body.dark .method-pill {
      background: rgba(255,255,255,0.08);
    }

    .index {
      font-size: 0.8rem;
      opacity: 0.7;
      text-align: right;
    }
  </style>
</head>

<body>
<div class="app">

  <div class="top-bar">
    <button id="toggleTheme">🌓 Modus</button>
  </div>

  <h1>Verschiedene Techniken zur Berechnung der Nullstellen von ganzrationalen Funktionen</h1>
  <div class="subtitle">
    Tippe/Klicke auf die Karte zum Umdrehen • Nutze Shuffle oder Weiter
  </div>

  <div class="card-wrapper">
    <div class="card">
      <div class="card-inner" id="cardInner">
        <div class="card-face card-front">
          <div>
            <div class="index" id="indexFront"></div>
            <div class="function" id="funcFront"></div>
            <p><strong>Frage:</strong><br>Wie würdest du die Nullstellen berechnen?</p>
          </div>
        </div>

        <div class="card-face card-back">
          <div>
            <div class="index" id="indexBack"></div>
            <div class="function" id="funcBack"></div>
            <div class="method-pill" id="methodBack"></div>
            <p id="hintBack"></p>
            <strong id="solutionBack"></strong>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button id="shuffle">🔀 Shuffle</button>
    <button id="next" class="primary">➡ Weiter</button>
  </div>
</div>

<script>
/* ============================
      KARTEIKARTEN 1–30
============================ */
const cards = [
  {
    func: "f(x) = x² - 9",
    method: "Äquivalenzumformungen",
    hint: "x² - 9 = 0\n+9 → x² = 9\n√ → x = ±3",
    solution: "Nullstellen: -3, 3"
  },
  {
    func: "f(x) = x² + 4x + 3",
    method: "p-q-Formel",
    hint: "p=4, q=3\nx = -2 ± √1",
    solution: "Nullstellen: -3, -1"
  },
  {
    func: "f(x) = x² - 2x",
    method: "Ausklammern",
    hint: "x(x - 2)\n→ x=0 oder x=2",
    solution: "Nullstellen: 0, 2"
  },
  {
    func: "f(x) = x² + 7x + 10",
    method: "p-q-Formel",
    hint: "p=7, q=10\nx = -3.5 ± 1.5",
    solution: "Nullstellen: -5, -2"
  },
  {
    func: "f(x) = 2x² - 18",
    method: "Äquivalenzumformungen",
    hint: "/2 → x² - 9=0\n+9 → x²=9\n√ → ±3",
    solution: "Nullstellen: -3, 3"
  },
  {
    func: "f(x) = 3x² + 12x",
    method: "Ausklammern",
    hint: "3x(x+4)\n→ x=0 oder -4",
    solution: "Nullstellen: 0, -4"
  },
  {
    func: "f(x) = x³ - x",
    method: "Ausklammern",
    hint: "x(x² -1) → x=0\nx²-1=0 → ±1",
    solution: "Nullstellen: -1, 0, 1"
  },
  {
    func: "f(x) = x³ - 4x² + 4x",
    method: "Ausklammern + p-q",
    hint: "x(x² -4x +4)\np=-4,q=4\nx=2 ±0",
    solution: "Nullstellen: 0, 2 (doppelt)"
  },
  {
    func: "f(x) = x⁴ - 5x² + 4",
    method: "Substitution t=x²",
    hint: "t² -5t +4=0\n→ t=2,3\nx=±√2, ±√3",
    solution: "Nullstellen: ±√2, ±√3"
  },
  {
    func: "f(x) = x⁴ + 2x² - 8",
    method: "Substitution",
    hint: "t² +2t -8=0\nt=2,-4\nnur t=2 möglich\nx=±√2",
    solution: "Nullstellen: ±√2"
  },
  {
    func: "f(x) = x³ + x² - 6x",
    method: "Ausklammern + p-q",
    hint: "x(x²+x-6)\np=1,q=-6\nx=-0.5 ±2.5",
    solution: "Nullstellen: -3,0,2"
  },
  {
    func: "f(x) = 2x³ - 8",
    method: "Äquivalenzumformungen",
    hint: "2x³=8 → x³=4 → x=∛4",
    solution: "Nullstelle: ∛4"
  },
  {
    func: "f(x) = x³ - 6x² + 11x - 6",
    method: "Polynomdivision",
    hint: "f(1)=0\n→ durch (1) teilen → x²-5x+6",
    solution: "Nullstellen: 1,2,3"
  },
  {
    func: "f(x) = x³ + 3x² -4",
    method: "Polynomdivision",
    hint: "f(1)=0 → teilen → x²+4x-4",
    solution: "Nullstellen: 1, -2±2√2"
  },
  {
    func: "f(x) = x⁴ - x³ - 6x²",
    method: "Ausklammern",
    hint: "x²(x² -x -6)\n→ x=-2,3 und x=0 doppelt",
    solution: "Nullstellen: 0 (doppelt), -2, 3"
  },

  /* ==== 16–30 ==== */
  {
    func: "f(x) = 5x² - 20x",
    method: "Ausklammern",
    hint: "5x(x-4)\n→ x=0,4",
    solution: "Nullstellen: 0,4"
  },
  {
    func: "f(x) = x² + x - 12",
    method: "p-q-Formel",
    hint: "p=1,q=-12\nx=-0.5 ±√12",
    solution: "Nullstellen: -4,3"
  },
  {
    func: "f(x) = x³ - 9x",
    method: "Ausklammern",
    hint: "x(x²-9)\n→ x=0, ±3",
    solution: "Nullstellen: -3,0,3"
  },
  {
    func: "f(x) = 3x³ + 6x² - 24x",
    method: "Ausklammern",
    hint: "3x(x²+2x-8)\np=2,q=-8",
    solution: "Nullstellen: -4,0,2"
  },
  {
    func: "f(x) = x⁴ - 16",
    method: "Äquivalenzumformungen",
    hint: "x⁴=16 → x²=±4\nnur x²=4\nx=±2",
    solution: "Nullstellen: -2,2"
  },
  {
    func: "f(x) = x³ - 2x² - 5x + 6",
    method: "Polynomdivision",
    hint: "f(1)=0 → teilen → x² -x -6",
    solution: "Nullstellen: 1,-2,3"
  },
  {
    func: "f(x) = 2x³ + 5x² -3x -6",
    method: "Polynomdivision",
    hint: "f(1)=0\ndiv→ 2x²+7x-6",
    solution: "Nullstellen: 1,-3,0.5"
  },
  {
    func: "f(x) = x² -4x +4",
    method: "p-q-Formel",
    hint: "p=-4,q=4\nx=2±0",
    solution: "Nullstelle: 2 (doppelt)"
  },
  {
    func: "f(x) = 4x² -1",
    method: "Äquivalenzumformungen",
    hint: "4x²=1 → x²=0.25 → ±0.5",
    solution: "Nullstellen: ±0.5"
  },
  {
    func: "f(x) = x⁴ +x²",
    method: "Ausklammern",
    hint: "x²(x²+1)=0",
    solution: "Nullstelle: 0 (doppelt)"
  },
  {
    func: "f(x) = x³ -25x",
    method: "Ausklammern",
    hint: "x(x²-25) → x=0,±5",
    solution: "Nullstellen: -5,0,5"
  },
  {
    func: "f(x) = 6x² +3x",
    method: "Ausklammern",
    hint: "3x(2x+1)\n→ x=0,-0.5",
    solution: "Nullstellen: 0,-0.5"
  },
  {
    func: "f(x) = x³ +4x² +4x",
    method: "Ausklammern",
    hint: "x(x²+4x+4)\np=4,q=4",
    solution: "Nullstellen: 0, -2 (doppelt)"
  },
  {
    func: "f(x) = x⁵ - x³",
    method: "Ausklammern",
    hint: "x³(x²-1)\n→ x=0 (dreifach), ±1",
    solution: "Nullstellen: -1,0,1"
  },
  {
    func: "f(x) = 2x⁴ -18x²",
    method: "Ausklammern",
    hint: "2x²(x²-9) → x=0, ±3",
    solution: "Nullstellen: -3,0,3"
  }
];

/* ============================
        LOGIK
============================ */
let index = 0;

const card = document.getElementById("cardInner");
const funcFront = document.getElementById("funcFront");
const funcBack = document.getElementById("funcBack");
const methodBack = document.getElementById("methodBack");
const hintBack = document.getElementById("hintBack");
const solutionBack = document.getElementById("solutionBack");
const indexFront = document.getElementById("indexFront");
const indexBack = document.getElementById("indexBack");

function showCard() {
  const c = cards[index];
  funcFront.textContent = c.func;
  funcBack.textContent = c.func;
  methodBack.textContent = c.method;
  hintBack.textContent = c.hint;
  solutionBack.textContent = c.solution;
  const txt = `Karte ${index + 1} / ${cards.length}`;
  indexFront.textContent = txt;
  indexBack.textContent = txt;
  card.classList.remove("flipped");
}

document.getElementById("next").onclick = () => {
  index = (index + 1) % cards.length;
  showCard();
};

document.getElementById("shuffle").onclick = () => {
  cards.sort(() => Math.random() - 0.5);
  index = 0;
  showCard();
};

card.onclick = () => card.classList.toggle("flipped");

document.getElementById("toggleTheme").onclick = () =>
  document.body.classList.toggle("dark");

showCard();
</script>

</body>
</html>
