<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verschiedene Techniken zur Berechnung der Nullstellen mit Mitternachtsformel und Substitution</title>

  <style>
    :root {
      --bg: #f2f2f2;
      --fg: #222;
      --card-bg: #ffffff;
      --card-fg: #222;
      --border: #dddddd;
      --accent: #0068ff;
      --shadow: 0 8px 20px rgba(0,0,0,0.08);
      --btn-bg: #e0e0e0;
      --btn-fg: #222;
    }

    body.dark {
      --bg: #111;
      --fg: #f5f5f5;
      --card-bg: #1d1d1d;
      --card-fg: #ffffff;
      --border: #333;
      --accent: #66aaff;
      --shadow: 0 8px 20px rgba(0,0,0,0.5);
      --btn-bg: #2a2a2a;
      --btn-fg: #f5f5f5;
    }

    body {
      font-family: system-ui, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--fg);
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 650px;
    }

    h1 {
      text-align: center;
      font-size: 1.4rem;
      margin-bottom: 12px;
    }

    .subtitle {
      text-align: center;
      opacity: 0.8;
      font-size: 0.9rem;
      margin-bottom: 20px;
    }

    .top-bar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 12px;
    }

    button {
      border: none;
      padding: 8px 14px;
      border-radius: 999px;
      background: var(--btn-bg);
      color: var(--btn-fg);
      cursor: pointer;
      transition: 0.2s;
      font-size: 0.9rem;
    }

    button.primary {
      background: var(--accent);
      color: #ffffff;
    }

    button:active {
      transform: scale(0.96);
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 16px;
    }

    .card-wrapper {
      display: flex;
      justify-content: center;
      margin-bottom: 60px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      height: 300px;
      perspective: 1000px;
    }

    .card-inner {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.5s;
      cursor: pointer;
    }

    .card-inner.flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      padding: 20px;
      border-radius: 20px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      background: var(--card-bg);
      color: var(--card-fg);
      backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      white-space: pre-line;
    }

    .card-back {
      transform: rotateY(180deg);
    }

    .function {
      font-size: 1.2rem;
      font-weight: 600;
    }

    .method-pill {
      padding: 6px 10px;
      background: rgba(0,0,0,0.05);
      border-radius: 8px;
      display: inline-block;
      margin: 6px 0;
      font-size: 0.85rem;
    }

    body.dark .method-pill {
      background: rgba(255,255,255,0.08);
    }

    .index {
      font-size: 0.8rem;
      opacity: 0.7;
      text-align: right;
    }
  </style>
</head>

<body>
<div class="app">

  <div class="top-bar">
    <button id="toggleTheme">🌓 Modus</button>
  </div>

  <h1>Verschiedene Techniken zur Berechnung der Nullstellen</h1>
  <div class="subtitle">
    Mit Mitternachtsformel, Satz des Nullprodukts, Äquivalenzumformungen und Substitution
  </div>

  <div class="card-wrapper">
    <div class="card">
      <div class="card-inner" id="cardInner">
        <div class="card-face card-front">
          <div>
            <div class="index" id="indexFront"></div>
            <div class="function" id="funcFront"></div>
            <p><strong>Frage:</strong><br>Wie würdest du die Nullstellen berechnen?</p>
          </div>
        </div>

        <div class="card-face card-back">
          <div>
            <div class="index" id="indexBack"></div>
            <div class="function" id="funcBack"></div>
            <div class="method-pill" id="methodBack"></div>
            <p id="hintBack"></p>
            <strong id="solutionBack"></strong>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button id="shuffle">🔀 Shuffle</button>
    <button id="next" class="primary">➡ Weiter</button>
  </div>
</div>

<script>
/* ============================
      KARTEIKARTEN 1-30
============================ */
const cards = [
  {
    func: "f(x) = x² - 9",
    method: "Äquivalenzumformungen",
    hint: "x² - 9 = 0\n+9 -> x² = 9\n√ -> x = ±3",
    solution: "Nullstellen: -3, 3"
  },
  {
    func: "f(x) = x² + 4x + 3",
    method: "Mitternachtsformel",
    hint: "a=1, b=4, c=3\nx = (-4 ± √(16-12)) / 2\nx = (-4 ± 2) / 2",
    solution: "Nullstellen: -3, -1"
  },
  {
    func: "f(x) = x² - 2x",
    method: "Ausklammern + Satz des Nullprodukts",
    hint: "x(x - 2) = 0\nSatz des Nullprodukts -> x=0 oder x=2",
    solution: "Nullstellen: 0, 2"
  },
  {
    func: "f(x) = x² + 7x + 10",
    method: "Mitternachtsformel",
    hint: "a=1, b=7, c=10\nx = (-7 ± √(49-40)) / 2\nx = (-7 ± 3) / 2",
    solution: "Nullstellen: -5, -2"
  },
  {
    func: "f(x) = 2x² - 18",
    method: "Äquivalenzumformungen",
    hint: "/2 -> x² - 9 = 0\n+9 -> x² = 9\n√ -> x = ±3",
    solution: "Nullstellen: -3, 3"
  },
  {
    func: "f(x) = 3x² + 12x",
    method: "Ausklammern + Satz des Nullprodukts",
    hint: "3x(x + 4) = 0\nSatz des Nullprodukts -> x=0 oder x=-4",
    solution: "Nullstellen: 0, -4"
  },
  {
    func: "f(x) = x³ - x",
    method: "Ausklammern + Satz des Nullprodukts",
    hint: "x(x² - 1) = 0\nSatz des Nullprodukts -> x=0 oder x²-1=0\nx = ±1",
    solution: "Nullstellen: -1, 0, 1"
  },
  {
    func: "f(x) = x³ - 4x² + 4x",
    method: "Ausklammern + Satz des Nullprodukts + Mitternachtsformel",
    hint: "x(x² - 4x + 4) = 0\nSatz des Nullprodukts -> x=0 oder x²-4x+4=0\na=1, b=-4, c=4\nx = (4 ± √0) / 2",
    solution: "Nullstellen: 0, 2 (doppelt)"
  },
  {
    func: "f(x) = x⁴ - 5x² + 4",
    method: "Substitution z = x²",
    hint: "z² - 5z + 4 = 0\n(z-1)(z-4)=0\nz=1 oder z=4\nalso x²=1 oder x²=4",
    solution: "Nullstellen: -2, -1, 1, 2"
  },
  {
    func: "f(x) = x⁴ + 2x² - 8",
    method: "Substitution z = x²",
    hint: "z² + 2z - 8 = 0\n(z+4)(z-2)=0\nz=-4 oder z=2\nnur z=2 ist möglich",
    solution: "Nullstellen: ±√2"
  },
  {
    func: "f(x) = x³ + x² - 6x",
    method: "Ausklammern + Satz des Nullprodukts + Mitternachtsformel",
    hint: "x(x² + x - 6) = 0\nSatz des Nullprodukts -> x=0 oder x²+x-6=0\na=1, b=1, c=-6\nx = (-1 ± √25) / 2",
    solution: "Nullstellen: -3, 0, 2"
  },
  {
    func: "f(x) = 2x³ - 8",
    method: "Äquivalenzumformungen",
    hint: "2x³ = 8 -> x³ = 4\nx = ∛4",
    solution: "Nullstelle: ∛4"
  },
  {
    func: "f(x) = x⁴ + x² - 8",
    method: "Substitution z = x²",
    hint: "z² + z - 8 = 0\nz = (-1 ± √33) / 2\nnur der positive Wert ist zulässig",
    solution: "Nullstellen: ±√((-1 + √33) / 2)"
  },
  {
    func: "f(x) = x⁴ - 10x² + 9",
    method: "Substitution z = x²",
    hint: "z² - 10z + 9 = 0\n(z-1)(z-9)=0\nz=1 oder z=9\nalso x²=1 oder x²=9",
    solution: "Nullstellen: -3, -1, 1, 3"
  },
  {
    func: "f(x) = x⁴ - x³ - 6x²",
    method: "Ausklammern + Satz des Nullprodukts + Mitternachtsformel",
    hint: "x²(x² - x - 6) = 0\nSatz des Nullprodukts -> x=0 oder x²-x-6=0\nfür x² - x - 6 gilt:\na=1, b=-1, c=-6",
    solution: "Nullstellen: 0 (doppelt), -2, 3"
  },
  {
    func: "f(x) = 5x² - 20x",
    method: "Ausklammern + Satz des Nullprodukts",
    hint: "5x(x - 4) = 0\nSatz des Nullprodukts -> x=0 oder x=4",
    solution: "Nullstellen: 0, 4"
  },
  {
    func: "f(x) = x² + x - 12",
    method: "Mitternachtsformel",
    hint: "a=1, b=1, c=-12\nx = (-1 ± √49) / 2",
    solution: "Nullstellen: -4, 3"
  },
  {
    func: "f(x) = x³ - 9x",
    method: "Ausklammern + Satz des Nullprodukts",
    hint: "x(x² - 9) = 0\nSatz des Nullprodukts -> x=0 oder x²-9=0\nx = ±3",
    solution: "Nullstellen: -3, 0, 3"
  },
  {
    func: "f(x) = 3x³ + 6x² - 24x",
    method: "Ausklammern + Satz des Nullprodukts + Mitternachtsformel",
    hint: "3x(x² + 2x - 8) = 0\nSatz des Nullprodukts -> x=0 oder x²+2x-8=0\na=1, b=2, c=-8\nx = (-2 ± √36) / 2",
    solution: "Nullstellen: -4, 0, 2"
  },
  {
    func: "f(x) = x⁴ - 16",
    method: "Äquivalenzumformungen",
    hint: "x⁴ = 16\nalso x² = 4\nx = ±2",
    solution: "Nullstellen: -2, 2"
  },
  {
    func: "f(x) = x⁶ - 5x³ + 4",
    method: "Substitution z = x³",
    hint: "z² - 5z + 4 = 0\n(z-1)(z-4)=0\nz=1 oder z=4\nalso x³=1 oder x³=4",
    solution: "Nullstellen: 1, ∛4"
  },
  {
    func: "f(x) = x⁴ - 13x² + 36",
    method: "Substitution z = x²",
    hint: "z² - 13z + 36 = 0\n(z-4)(z-9)=0\nz=4 oder z=9\nalso x²=4 oder x²=9",
    solution: "Nullstellen: -3, -2, 2, 3"
  },
  {
    func: "f(x) = x² - 4x + 4",
    method: "Mitternachtsformel",
    hint: "a=1, b=-4, c=4\nx = (4 ± √0) / 2",
    solution: "Nullstelle: 2 (doppelt)"
  },
  {
    func: "f(x) = 4x² - 1",
    method: "Äquivalenzumformungen",
    hint: "4x² = 1 -> x² = 0.25\nx = ±0.5",
    solution: "Nullstellen: -0.5, 0.5"
  },
  {
    func: "f(x) = x⁴ + x²",
    method: "Ausklammern + Satz des Nullprodukts",
    hint: "x²(x² + 1) = 0\nSatz des Nullprodukts -> x²=0 oder x²+1=0\nüber R nur x=0",
    solution: "Nullstelle: 0 (doppelt)"
  },
  {
    func: "f(x) = x³ - 25x",
    method: "Ausklammern + Satz des Nullprodukts",
    hint: "x(x² - 25) = 0\nSatz des Nullprodukts -> x=0 oder x²-25=0\nx = ±5",
    solution: "Nullstellen: -5, 0, 5"
  },
  {
    func: "f(x) = 6x² + 3x",
    method: "Ausklammern + Satz des Nullprodukts",
    hint: "3x(2x + 1) = 0\nSatz des Nullprodukts -> x=0 oder x=-0.5",
    solution: "Nullstellen: 0, -0.5"
  },
  {
    func: "f(x) = x³ + 4x² + 4x",
    method: "Ausklammern + Satz des Nullprodukts + Mitternachtsformel",
    hint: "x(x² + 4x + 4) = 0\nSatz des Nullprodukts -> x=0 oder x²+4x+4=0\na=1, b=4, c=4\nx = (-4 ± √0) / 2",
    solution: "Nullstellen: 0, -2 (doppelt)"
  },
  {
    func: "f(x) = x⁵ - x³",
    method: "Ausklammern + Satz des Nullprodukts",
    hint: "x³(x² - 1) = 0\nSatz des Nullprodukts -> x=0 oder x²-1=0\nx = 0 (dreifach), ±1",
    solution: "Nullstellen: -1, 0, 1"
  },
  {
    func: "f(x) = 2x⁴ - 18x²",
    method: "Ausklammern + Satz des Nullprodukts",
    hint: "2x²(x² - 9) = 0\nSatz des Nullprodukts -> x=0 oder x²-9=0\nx = ±3",
    solution: "Nullstellen: -3, 0, 3"
  }
];

/* ============================
        LOGIK
============================ */
let index = 0;

const card = document.getElementById("cardInner");
const funcFront = document.getElementById("funcFront");
const funcBack = document.getElementById("funcBack");
const methodBack = document.getElementById("methodBack");
const hintBack = document.getElementById("hintBack");
const solutionBack = document.getElementById("solutionBack");
const indexFront = document.getElementById("indexFront");
const indexBack = document.getElementById("indexBack");

function showCard() {
  const c = cards[index];
  funcFront.textContent = c.func;
  funcBack.textContent = c.func;
  methodBack.textContent = c.method;
  hintBack.textContent = c.hint;
  solutionBack.textContent = c.solution;
  const txt = `Karte ${index + 1} / ${cards.length}`;
  indexFront.textContent = txt;
  indexBack.textContent = txt;
  card.classList.remove("flipped");
}

document.getElementById("next").onclick = () => {
  index = (index + 1) % cards.length;
  showCard();
};

document.getElementById("shuffle").onclick = () => {
  cards.sort(() => Math.random() - 0.5);
  index = 0;
  showCard();
};

card.onclick = () => card.classList.toggle("flipped");

document.getElementById("toggleTheme").onclick = () =>
  document.body.classList.toggle("dark");

showCard();
</script>

</body>
</html>
